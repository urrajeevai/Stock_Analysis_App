server:
  port: 8085

spring:
  application:
    name: performance-service
  datasource:
    url: jdbc:mysql://localhost:3306/stock_analysis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: VARCHAR

jwt:
  secret: ${JWT_SECRET:stockapp-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-token-expiry-ms: ${JWT_EXPIRY_MS:900000}

internal:
  token: ${INTERNAL_TOKEN:internal-default-token-change-me}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

trade-service:
  url: http://localhost:8082

logging:
  level:
    com.stockapp: DEBUG

