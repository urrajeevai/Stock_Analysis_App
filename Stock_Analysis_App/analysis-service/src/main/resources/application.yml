server:
  port: 8083

spring:
  application:
    name: analysis-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 40MB
  datasource:
    url: jdbc:mysql://localhost:3306/stock_analysis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: VARCHAR

jwt:
  secret: stockapp-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-token-expiry-ms: 900000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  upload:
    dir: uploads/analyses
  pagination:
    analysis:
      page-size: 20

logging:
  level:
    com.stockapp: DEBUG

